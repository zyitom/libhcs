name: Release Package

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build SDK package
        uses: docker/build-push-action@v6
        with:
          context: . # Use workspace context to keep .git
          file: Dockerfile.build_sdk
          build-args: |
            WITH_SOURCE=true
          outputs: type=local,dest=build/
          cache-from: type=gha,scope=docker-build-amd64

      - name: Build firmware package
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.build_firmware
          outputs: type=local,dest=build/
          cache-from: type=gha,scope=docker-build-amd64

      - name: Upload SDK source
        uses: actions/upload-artifact@v6
        with:
          name: libhcs-sdk-src
          path: build/libhcs-sdk-src*
          if-no-files-found: error

      - name: Upload SDK Debian package
        uses: actions/upload-artifact@v6
        with:
          name: libhcs-sdk-deb-amd64
          path: build/libhcs-sdk*.deb
          if-no-files-found: error

      - name: Upload firmware
        uses: actions/upload-artifact@v6
        with:
          name: libhcs-firmware
          path: |
            build/libhcs-firmware*
            build/libhcs-bootloader*
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: libhcs-*
          merge-multiple: true

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
          prerelease: true
          generate_release_notes: true
