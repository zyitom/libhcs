name: Docker Image CI

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker-image.yml
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

env:
  REGISTRY_IMAGE_CI: ${{ vars.DOCKERHUB_USERNAME }}/libhcs-ci
  REGISTRY_IMAGE_DEVELOP: ${{ vars.DOCKERHUB_USERNAME }}/libhcs-develop

jobs:
  build:
    name: Build amd64 images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Free disk space
        uses: BRAINSia/free-disk-space@v2
        with:
          tool-cache: false
          mandb: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Build and push CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ci
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY_IMAGE_CI }}:latest
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=docker-ci-amd64
          cache-to: type=gha,mode=max,scope=docker-ci-amd64

      - name: Build and push develop image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: develop
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY_IMAGE_DEVELOP }}:latest
          cache-from: type=gha,scope=docker-develop-amd64
          cache-to: type=gha,mode=max,scope=docker-develop-amd64

      - name: Inspect images
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY_IMAGE_CI }}:latest"
          docker buildx imagetools inspect "${{ env.REGISTRY_IMAGE_DEVELOP }}:latest"
