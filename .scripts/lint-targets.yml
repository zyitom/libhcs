exclude:
  - bsp
  - build

host:
  cmake: host/CMakeLists.txt
  folders:
    - core/src
    - core/include
    - host/src
    - host/include

hpm_board:
  cmake: firmware/hpm_board/CMakeLists.txt
  # core/ is left to host, c_board and mc02. Most entries in this superbuild's
  # compilation database are HPM SDK C files without core/include on their
  # include path, and clang-tidy borrows one of them to parse a core header
  # ("libhcs/spec/gpio.hpp file not found").
  folders:
    - firmware/hpm_board/app/src
    - firmware/hpm_board/app/include
    - firmware/hpm_board/bootloader/src
    - firmware/hpm_board/bootloader/include

c_board:
  cmake: firmware/c_board/CMakeLists.txt
  folders:
    - core/src
    - core/include
    - firmware/c_board/app/src
    - firmware/c_board/app/include
    - firmware/c_board/bootloader/src
    - firmware/c_board/bootloader/include

mc02:
  cmake: firmware/mc02/CMakeLists.txt
  folders:
    - core/src
    - core/include
    - firmware/mc02/app/src
    - firmware/mc02/app/include
    - firmware/mc02/bootloader/src
    - firmware/mc02/bootloader/include
